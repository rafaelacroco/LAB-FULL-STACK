<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Blog</title>
  </head>
  <body>
    <div class="container">
      <h2>Cadastrar Post</h2>
      <form action="/cadastrar_post" method="post">
        <p>Título: <input type="text" name="titulo"></p>
        <p>Resumo: <input type="text" name="resumo"></p>
        <p>Conteúdo: <input type="text" name="conteudo"></p>
        <input type="submit" value="Cadastrar Post">
      </form>

      <hr>

      <h2>Procurar Post</h2>
      <form action="/procurar_post" method="post">
        <p>Resumo: <input type="text" name="resumo"></p>
        <input type="submit" value="Enviar">
      </form>
    </div>
  </body>
</html>
